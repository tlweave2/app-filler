# ============================================================================
# RESUME BASE — the superset of everything you could say about yourself.
#
# Every bullet carries `tags`. A variant is generated by selecting tags, not
# by rewriting:
#
#   ./af resume --tags backend,python --out resume/variants/resume-backend.md
#
# Write MORE bullets than fit on one page. That's the point — the base is a
# library, the variant is the page. A bullet that's cut from one variant is
# the lead bullet of another.
#
# Bullet formula that actually survives a recruiter skim:
#   <action verb> <what> <that produced this measurable result>
# If a bullet has no number in it, ask whether it's worth its line.
# ============================================================================

[header]
name     = ""
headline = ""                   # "Senior Backend Engineer — Payments & Infrastructure"
email    = ""
phone    = ""
location = ""                   # "Sacramento, CA" — city/state is enough
linkedin = ""
github   = ""
portfolio = ""

# Summary variants — pick one per resume variant with --summary <id>.
# Two or three sentences. Skip it entirely if you'd rather lead with experience.
[[summaries]]
id       = "default"
tags     = ["default"]
headline = ""                   # optional: overrides header.headline for this variant
text     = ""

# [[summaries]]
# id       = "backend"
# tags     = ["backend"]
# headline = "Senior Backend Engineer — Payments & Infrastructure"
# text     = "Backend engineer with 8 years building payment systems at scale..."

# ---------------------------------------------------------------------------
# EXPERIENCE — one [[jobs]] block per role, most recent first.
# `company`/`title`/`dates` should match profile.toml exactly. `af doctor`
# cross-checks them so your resume and your form answers never disagree —
# which is a real rejection reason on background checks.
# ---------------------------------------------------------------------------
[[jobs]]
company  = ""
title    = ""
location = ""
start    = ""                   # YYYY-MM
end      = ""                   # YYYY-MM, or "" for current
tags     = ["default"]          # tags on the JOB — controls whether it appears at all

  [[jobs.bullets]]
  text = ""
  tags = ["default"]
  # Example of what a good one looks like — delete this comment block once
  # you've written your own:
  #   text = "Cut p99 checkout latency from 1.8s to 340ms by replacing the
  #           synchronous fraud check with a queued worker, unblocking a
  #           $2M/mo revenue stream during peak."
  #   tags = ["backend", "performance", "python"]

# ---------------------------------------------------------------------------
# PROJECTS — optional. Valuable when you have a gap, are changing fields, or
# your best work isn't something an employer paid you for.
# ---------------------------------------------------------------------------
[[projects]]
name = ""
link = ""
tags = ["default"]
description = ""

  [[projects.bullets]]
  text = ""
  tags = ["default"]

# ---------------------------------------------------------------------------
# EDUCATION — mirrors profile.toml.
# ---------------------------------------------------------------------------
[[education]]
school   = ""
degree   = ""
field    = ""
location = ""
end      = ""
gpa      = ""                   # include only if it helps you
honors   = ""
tags     = ["default"]

# ---------------------------------------------------------------------------
# SKILLS — grouped. Tags control which groups show on which variant.
# Keep these honest: anything listed here is fair game in an interview.
# ---------------------------------------------------------------------------
[[skill_groups]]
name  = ""                      # "Languages"
items = []                      # ["Python", "Go", "TypeScript"]
tags  = ["default"]
